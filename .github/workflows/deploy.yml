name: Deploy Cookly to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository variables are optional. With the default false value the site
      # builds and deploys without PostHog configuration.
      VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED || 'false' }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_FRIDGE_ASSISTANT_URL: ${{ vars.VITE_FRIDGE_ASSISTANT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate analytics configuration
        shell: bash
        run: |
          if [[ "$VITE_ANALYTICS_ENABLED" != "true" && "$VITE_ANALYTICS_ENABLED" != "false" ]]; then
            echo "::error::VITE_ANALYTICS_ENABLED must be true or false."
            exit 1
          fi

          if [[ "$VITE_ANALYTICS_ENABLED" == "true" && ( -z "$VITE_POSTHOG_KEY" || -z "$VITE_POSTHOG_HOST" ) ]]; then
            echo "::error::PostHog is enabled, but VITE_POSTHOG_KEY or VITE_POSTHOG_HOST is missing."
            exit 1
          fi

          if [[ "$VITE_ANALYTICS_ENABLED" == "true" ]]; then
            if [[ ! "$VITE_POSTHOG_KEY" =~ ^phc_[[:alnum:]]+$ ]]; then
              echo "::error::VITE_POSTHOG_KEY must be a public PostHog Project API Key starting with phc_. Never use a Personal API Key in a Vite build."
              exit 1
            fi
          fi

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Build AI gateway artifact
        run: npm run build:assistant

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
